# Tabla de temas de Informado
#
# Cómo se asigna el tema a una nota, en este orden:
#   1. Reglas por palabras clave (Sindicales y Ciudad atraviesan secciones: ningún diario las tiene).
#   2. Sección del diario (primer tramo de la URL o el feed del que vino).
#   3. Si no hay sección (Página/12) o es genérica, palabras clave de todos los temas.
#   4. Si nada coincide: "otros". Se guarda igual, por si más adelante sumás temas.
#
# Las palabras se comparan como palabras completas (no "pro" dentro de "provincia"), sin tildes
# y en minúsculas, contra título + bajada + palabras clave del sitemap.

temas:
  politica:
    nombre: Política
    secciones: [politica, el-pais, economia-politica]
    palabras: [congreso, diputados, senado, gobierno nacional, casa rosada, milei, ministro, oposicion,
               peronismo, kirchnerismo, libertad avanza, pro, ucr, gobernador, legislatura, decreto,
               justicia, corte suprema, fiscal, elecciones, sesion]

  economia:
    nombre: Economía
    secciones: [economia, finanzas, finanzas-mercados, negocios, rural, energia, energia-y-mineria,
                novedades-fiscales, campo]
    palabras: [dolar, inflacion, indec, bcra, banco central, reservas, tesoro, licitacion, deuda,
               fmi, tarifas, impuesto, arca, jubilacion, salario, riesgo pais, exportaciones, superavit]

  internacionales:
    nombre: Internacionales
    secciones: [mundo, el-mundo, internacional, internacionales, america]
    palabras: [trump, casa blanca, union europea, onu, otan, ucrania, rusia, china, israel, gaza,
               brasil, lula, chile, uruguay, paraguay, bolivia, peru, colombia, mexico, venezuela,
               estados unidos, espana, francia, alemania, italia, reino unido, europa, papa leon]

  sindicales:
    nombre: Sindicales
    secciones: []
    prioridad: alta   # gana sobre la sección: un paro en "Economía" va a Sindicales
    palabras: [cgt, cta, gremios, gremial, sindicato, sindical, paritaria, paro general, paro de,
               huelga, medida de fuerza, plan de lucha, convenio colectivo, uom, ate, uta, camioneros,
               bancarios, docentes, ctera, utedyc, smata, delegados, reforma laboral]

  ciudad:
    nombre: Ciudad
    secciones: [ciudades, ciudad-de-buenos-aires, sururbano, zonales]
    prioridad: media  # gana sobre secciones genéricas ("sociedad", "información general"), no sobre Política o Economía
    palabras: [caba, porteno, portenos, ciudad de buenos aires, legislatura portena, jorge macri,
               conurbano, amba, gran buenos aires, subte, emova, premetro, colectivos, linea de colectivo,
               trenes, aysa, edenor, edesur, corte de luz, corte de agua, palermo, recoleta, la matanza,
               quilmes, avellaneda, lomas de zamora]

  futbol:
    nombre: Fútbol
    secciones: [futbol, futbol-primera, futbol-ascenso, futbol-internacional, seleccion, river-plate,
                boca-juniors, racing, independiente, san-lorenzo, estudiantes, gimnasia-y-esgrima,
                rosario-central, newells-old-boys, lanus, velez, huracan, talleres, belgrano, instituto]
    # La sección "deportes" de los diarios generales entra solo si menciona fútbol:
    secciones_condicionales:
      deportes: [futbol, gol, river, boca, racing, independiente, san lorenzo, seleccion argentina,
                 scaloni, liga profesional, afa, copa libertadores, sudamericana, torneo, dt, clasico]
    palabras: [liga profesional, afa, copa libertadores, copa sudamericana, scaloni, seleccion argentina]

# Fútbol del exterior (decisión de Nico del 27/11): de las ligas y copas de otros países solo entran
# los campeones o lo que excede lo futbolístico (por ejemplo, un jugador que muere en la cancha).
# La Selección Argentina, en todas sus edades, y los clubes argentinos entran como fútbol local.
# Se evalúa solo sobre notas que ya quedaron en Fútbol; si no se salvan, van a «otros».
futbol_exterior:
  secciones: [futbol-internacional]
  palabras: [champions league, europa league, conference league, premier league, liga de inglaterra,
             fa cup, laliga, la liga de espana, liga de espana, copa del rey, serie a de italia, liga de italia,
             calcio, bundesliga, liga de alemania, ligue 1, liga de francia, eredivisie, liga de portugal,
             mls, saudi pro league, liga saudi, brasileirao, liga mx,
             real madrid, barcelona, atletico de madrid, villarreal, sevilla, manchester united, manchester city,
             liverpool, chelsea, arsenal, tottenham, newcastle, aston villa, psg, paris saint germain,
             bayern munich, bayern, borussia dortmund, juventus, inter de milan, internazionale, milan, napoli,
             roma, lazio, atalanta, benfica, porto, inter miami, al nassr, al hilal, al ittihad]
  # Cualquiera de estas palabras salva la nota.
  salvo_local: [seleccion argentina, albiceleste, scaloni, sub 17, sub 20, sub 23, sub 15,
                seleccion sub, seleccion femenina, afa, liga profesional, torneo clausura, torneo apertura,
                primera nacional, copa argentina, copa libertadores, copa sudamericana, river, boca, racing,
                independiente, san lorenzo, estudiantes, gimnasia, rosario central, newells, lanus, velez,
                huracan, talleres, belgrano, instituto, argentinos juniors, banfield, tigre, platense,
                godoy cruz, defensa y justicia, barracas central, sarmiento, atletico tucuman,
                central cordoba, independiente rivadavia, riestra, aldosivi]
  salvo_campeon: [campeon, campeones, campeona, campeonas, se consagro, se consagraron, consagracion]
  salvo_extra: [murio, murieron, muerte, fallecio, fallecieron, fallecimiento, tragedia, rayo, accidente,
                detenido, detenida, detuvieron, denuncia, denunciado, racismo, racista, violencia,
                asesinato, asesinado, atentado, guerra, internado, terapia intensiva, cancer]

# Otros deportes que se cuelan en Fútbol (decisión de Nico del 27/11): van a «otros», salvo que la nota
# esté en una sección no deportiva (Política, Economía, etc.), donde se clasifica como cualquier nota.
futbol_otros_deportes: [basquet, baloncesto, nba]

# En estas secciones no se aplican las palabras de prioridad alta
# (evita que "porteño" en una nota de tenis o "Grêmio" la manden a Ciudad o Sindicales).
secciones_sin_prioridad: [deportes, tenis, basquet, poli, automovilismo, futbol, futbol-primera,
                          futbol-ascenso, futbol-internacional, seleccion, espectaculos, entretenimiento]

# Secciones que no entran a ningún tema y van a "otros" sin evaluar palabras clave.
secciones_otros: [espectaculos, entretenimiento, teleshow, fama, lifestyle, tecnologia, tecno,
                  ciencia, ciencia-y-tecnologia, salud, autos, turismo, cultura, policiales, seguridad,
                  opinion, opiniones, columnistas, tenis, basquet, poli, automovilismo]

# Palabras que mandan la nota a "otros" aunque venga de una sección con tema
# (p. ej. Miss Universo publicado en "internacional"). (Aprobado 25/11.)
palabras_otros: [miss universo, reality, farandula]

# Secciones genéricas: no definen tema por sí solas, se decide por palabras clave.
secciones_genericas: [sociedad, informacion-general, informacion-gral, general, ultimo, actualidad,
                      ambito-nacional, ambito-debate, provincia]
