# Fuentes de Informado
# Verificadas desde GitHub Actions el 24/11/2026 (ver sondeo/RESULTADO.md).
#
# Regla de contenido: de cada nota se guarda solo título, bajada (recortada a 40 palabras),
# fecha, sección y enlace. Nunca el cuerpo de la nota, aunque el feed lo traiga.
#
# rss:      feeds con bajada. Fuente principal.
# sitemaps: sitemaps de noticias. Suman volumen (título y fecha, a veces palabras clave), sin bajada.
# excluir_secciones: primer tramo de la URL que no entra (ediciones de otros países, servicios, etc.).

user_agent: "InformadoBot/0.1 (+https://github.com/nicoceijas/informado)"
pausa_entre_pedidos_seg: 1
recorte_bajada_palabras: 40

excluir_secciones_comunes:
  - videos
  - videoloop
  - astrologia
  - horoscopo
  - loterias
  - loterias-y-quinielas
  - recetas
  - avisos
  - comercial
  - fotos
  - podcast

# Notas automáticas o de servicio que no aportan a los temas (se comparan contra el título normalizado).
excluir_titulos:
  - clima hoy en
  - pronostico del tiempo para
  - quiniela
  - horoscopo
  - loteria
  # Notas automáticas de partidos de La Nación (decisión de Nico del 27/11): no suman información.
  - como seguir online
  - tv y streaming para ver

# Igual que excluir_titulos, pero con expresiones regulares sobre el título normalizado
# (sin tildes, minúsculas, sin signos). Resultados automáticos de La Nación (27/11):
# «Monza venció por 3-0 a Fiorentina, por la Liga de Italia 2026».
excluir_titulos_patrones:
  - '(vencio por|empato) \d+ \d+ (a|con) .+ por (el|la|los) .+ 20\d\d$'

# Coberturas «EN VIVO» (decisión de Nico del 27/11, propuesta D, opción 1): mezclan muchos asuntos en una
# sola nota, unen temas distintos y ensucian «Lo último». Expresiones regulares sobre el título original
# (sin normalizar, sin distinguir mayúsculas), porque lo que las distingue son los dos puntos:
# «Milei, EN VIVO: …» sí; «dejó de emitir programas en vivo» o «cómo ver en vivo» no.
excluir_titulos_vivo:
  - '\ben vivo\s*:'
  - '\bminuto a minuto\b'
  - '^\s*en (vivo|directo)\b'
  - '\ben directo\s*:'

# Notas de servicio: se guardan (búsqueda y «Tu día») pero no forman temas. Se comparan como
# palabras completas contra el título normalizado; gana la primera categoría que coincide.
# dolar y clima alimentan «Tu día»; las demás solo se sacan de los temas. (Aprobado 25/11.)
servicio_sin_tema:
  cotizaciones_exterior: [dolar hoy en, euro hoy en]
  dolar: [dolar blue hoy, dolar hoy, dolar tarjeta hoy, dolar mep hoy, dolar ccl hoy, dolar cripto hoy,
          dolar oficial hoy, dolar oficial a cuanto]
  cotizaciones: [a cuanto cotiza, a cuanto cotizan, a cuanto opera, a cuanto cerro, cotizacion al,
                 euro hoy, real hoy, bitcoin hoy, ethereum hoy]
  clima: [como estara el clima, como estara el tiempo, pronostico del tiempo, pronostico extendido,
          ola de calor, semana de calor, temperatura estara, alerta amarilla, alerta naranja, alerta roja,
          alerta por tormentas, alerta por calor, alerta por vientos]
  pagos: [quienes cobran hoy, quienes cobran anses hoy, cuando cobro, calendario de pagos, calendario de pago]

