name: Sondeo de fuentes

on:
  push:
    branches: [main]
    paths:
      - "sondeo/candidatos.json"
      - "sondeo/sondear.py"
      - ".github/workflows/sondeo.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sondeo
  cancel-in-progress: true

jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sondear diarios
        run: python sondeo/sondear.py
      - name: Guardar resultado
        run: |
          git config user.name "informado-bot"
          git config user.email "informado-bot@users.noreply.github.com"
          git add sondeo/resultado.json sondeo/RESULTADO.md
          git commit -m "Sondeo: resultado $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          git pull --rebase
          git push
