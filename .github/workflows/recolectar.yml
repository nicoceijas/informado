name: Recolectar, agrupar y publicar

on:
  schedule:
    - cron: "17 */2 * * *"   # cada 2 horas, minuto 17 (UTC)
    - cron: "47 */2 * * *"   # respaldo: solo corre si la última recolección tiene más de 90 min
  push:
    branches: [main]
    paths:
      - "informado/**"
      - "config/**"
      - "app/**"
      - ".github/workflows/recolectar.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  # GitHub a veces demora o saltea las corridas programadas. El horario de respaldo (minuto 47)
  # mira la hora de la última recolección y sigue solo si pasaron más de 90 minutos.
  control:
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.ver.outputs.correr }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: datos/ultima_recoleccion.json
          sparse-checkout-cone-mode: false
      - id: ver
        env:
          HORARIO: ${{ github.event.schedule }}
        run: |
          if [ "$HORARIO" != "47 */2 * * *" ]; then echo "correr=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          try:
              inicio = datetime.fromisoformat(json.load(open("datos/ultima_recoleccion.json"))["inicio"])
              minutos = (datetime.now(timezone.utc) - inicio).total_seconds() / 60
          except Exception:
              minutos = 9999
          print(f"correr={'true' if minutos > 90 else 'false'}")
          import sys; print(f"Última recolección hace {minutos:.0f} min", file=sys.stderr)
          PY

  recolectar:
    needs: control
    if: needs.control.outputs.correr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Pruebas
        run: python -m pytest -q tests
      - name: Recolectar
        run: python -m informado.recolectar
      - name: Agrupar temas
        run: python -m informado.agrupar
      - name: Guardar datos
        run: |
          git config user.name "informado-bot"
          git config user.email "informado-bot@users.noreply.github.com"
          git add datos/
          git commit -q -m "Datos: recolección $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: Armar sitio
        run: |
          mkdir -p _sitio/datos
          cp app/* _sitio/
          cp datos/temas/actual.json datos/temas/notas_semana.json _sitio/datos/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: publicar
        uses: actions/deploy-pages@v4
