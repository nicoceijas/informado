name: Recolectar, agrupar y publicar

on:
  schedule:
    - cron: "17 */2 * * *"   # respaldo del reloj (reloj.yml): solo corre si la última recolección tiene más de 90 min
    - cron: "47 */2 * * *"   # ídem
  push:
    branches: [main]
    paths:
      - "informado/**"
      - "config/**"
      - "app/**"
      - ".github/workflows/recolectar.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url || steps.publicar2.outputs.page_url || steps.publicar3.outputs.page_url }}
    steps:
      # Siempre desde lo último de main (no desde el commit que disparó la corrida): así cada corrida
      # parte de los datos que guardó la anterior y no choca con ellos al guardar.
      - uses: actions/checkout@v4
        with:
          ref: main
      # El ritmo de 2 horas lo marca reloj.yml. Los horarios de abajo son respaldo: miran la hora de
      # la última recolección y siguen solo si pasaron más de 90 minutos.
      - id: ver
        env:
          HORARIO: ${{ github.event.schedule }}
        run: |
          # Lanzada por el reloj, a mano o por un cambio: corre siempre. Por horario (respaldo): solo si
          # la última recolección tiene más de 90 minutos, para no duplicar la del reloj.
          if [ -z "$HORARIO" ]; then echo "correr=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          from datetime import datetime, timezone
          try:
              inicio = datetime.fromisoformat(json.load(open("datos/ultima_recoleccion.json"))["inicio"])
              minutos = (datetime.now(timezone.utc) - inicio).total_seconds() / 60
          except Exception:
              minutos = 9999
          print(f"correr={'true' if minutos > 90 else 'false'}")
          print(f"Última recolección hace {minutos:.0f} min", file=sys.stderr)
          PY
      - uses: actions/setup-python@v5
        if: steps.ver.outputs.correr == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
        if: steps.ver.outputs.correr == 'true'
      - name: Pruebas
        if: steps.ver.outputs.correr == 'true'
        run: python -m pytest -q tests
      - name: Recolectar
        if: steps.ver.outputs.correr == 'true'
        run: python -m informado.recolectar
      - name: Agrupar temas
        if: steps.ver.outputs.correr == 'true'
        run: python -m informado.agrupar
      - name: Indicadores (dólar, riesgo país, inflación)
        if: steps.ver.outputs.correr == 'true'
        continue-on-error: true   # si una fuente falla, queda el último valor y la corrida sigue
        run: python -m informado.indicadores
      - name: Alertas del SMN para el AMBA
        if: steps.ver.outputs.correr == 'true'
        continue-on-error: true   # si el SMN falla, la app usa la señal de los diarios
        run: python -m informado.alertas
      - name: Guardar datos
        if: steps.ver.outputs.correr == 'true'
        run: |
          git config user.name "informado-bot"
          git config user.email "informado-bot@users.noreply.github.com"
          git add datos/
          git commit -q -m "Datos: recolección $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          # Si alguien guardó mientras tanto, se rebasa; ante un choque, ganan los datos de esta corrida
          # (son los más nuevos). Si después de 3 intentos no se pudo guardar, la corrida falla a la vista.
          guardado=no
          for i in 1 2 3; do
            if git pull -q --rebase -X theirs && git push -q; then guardado=si; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$guardado" != si ]; then echo "::error::No se pudieron guardar los datos en el repositorio"; exit 1; fi
      - name: Armar sitio
        if: steps.ver.outputs.correr == 'true'
        run: |
          mkdir -p _sitio/datos
          cp app/* _sitio/
          cp datos/temas/actual.json datos/temas/notas_semana.json _sitio/datos/
          if [ -f datos/indicadores.json ]; then cp datos/indicadores.json _sitio/datos/; fi
          if [ -f datos/alertas_smn.json ]; then cp datos/alertas_smn.json _sitio/datos/; fi
      - uses: actions/configure-pages@v5
        if: steps.ver.outputs.correr == 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.ver.outputs.correr == 'true'
        with:
          path: _sitio
      # Publicación con reintentos: a veces GitHub todavía no lista el paquete recién subido
      # («No artifacts named github-pages were found»). Se prueba 3 veces, esperando 15 s y 45 s.
      - id: publicar
        if: steps.ver.outputs.correr == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.ver.outputs.correr == 'true' && steps.publicar.outcome == 'failure'
        run: sleep 15
      - id: publicar2
        if: steps.ver.outputs.correr == 'true' && steps.publicar.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.ver.outputs.correr == 'true' && steps.publicar2.outcome == 'failure'
        run: sleep 45
      - id: publicar3
        if: steps.ver.outputs.correr == 'true' && steps.publicar2.outcome == 'failure'
        uses: actions/deploy-pages@v4
